[violations.te_trailers_parameter_forbidden]
# TE hangs a parameter or a weight off the trailers keyword
severity = "warn"

[violations.token68_body_empty]
# token68 is padding with no body
severity = "warn"

[violations.token68_character_forbidden]
# token68 holds a character outside its alphabet
severity = "warn"

[violations.token68_padding_malformed]
# token68 padding holds something other than '='
severity = "warn"

[violations.token68_whitespace_or_control_forbidden]
# token68 holds whitespace or a control character
severity = "error"

[violations.token_character_forbidden]
# Token holds a character outside tchar
severity = "warn"

[violations.token_empty]
# Token is written with no characters in it
severity = "warn"

[violations.token_whitespace_or_control_forbidden]
# Token holds whitespace or a control character
severity = "error"

[violations.transfer_coding_parameter_forbidden]
# A coding that defines no parameters carries one
severity = "warn"

[violations.transfer_coding_parameter_missing]
# A coding writes a ';' with no parameter after it
severity = "warn"

[violations.transfer_coding_unregistered]
# Transfer coding is not one the deployment recognises
severity = "warn"

[violations.transfer_encoding_chunked_duplicated]
# The chunked transfer coding is applied more than once
severity = "warn"

[violations.transfer_encoding_chunked_missing]
# A coding is applied and chunked never is
severity = "warn"

[violations.transfer_encoding_chunked_position_invalid]
# The chunked transfer coding is not the final one
severity = "warn"

[violations.transfer_encoding_coding_redundant]
# A coding is applied in transit that the representation already carries
severity = "info"

[violations.upgrade_101_empty]
# A 101 response names no protocol on its Upgrade field
severity = "error"

[violations.upgrade_101_missing]
# A 101 response carries no Upgrade field
severity = "error"

[violations.upgrade_426_empty]
# A 426 response names no protocol on its Upgrade field
severity = "warn"

[violations.upgrade_426_missing]
# A 426 response carries no Upgrade field
severity = "warn"

[violations.uri_character_forbidden]
# Value holds a character no URI is written with
severity = "warn"

[violations.uri_host_bracket_forbidden]
# Host holds a square bracket outside an IP literal
severity = "warn"

[violations.uri_host_character_forbidden]
# Host holds a character outside the registered-name alphabet
severity = "warn"

[violations.uri_host_closing_bracket_missing]
# Host opens an IP literal and never closes it
severity = "warn"

[violations.uri_host_empty]
# An http or https reference names no host
severity = "error"

[violations.uri_host_ip_literal_malformed]
# Host brackets something that is not an IP literal
severity = "warn"

[violations.uri_port_character_forbidden]
# Port holds a character that is not a digit
severity = "warn"

[violations.uri_scheme_character_forbidden]
# URI scheme holds a character outside letters, digits, '+', '-' and '.'
severity = "warn"

[violations.uri_scheme_empty]
# URI scheme is empty
severity = "warn"

[violations.uri_scheme_leading_letter_missing]
# URI scheme does not begin with a letter
severity = "warn"

[violations.via_comment_duplicated]
# Via member carries more than one comment
severity = "warn"

[violations.via_member_malformed]
# Via member does not end where the production ends it
severity = "warn"

[violations.via_received_by_missing]
# Via member names no received-by
severity = "warn"

[violations.via_received_by_obsolete]
# Via received-by is spelled as a uri-host
severity = "warn"

[violations.weight_equals_whitespace_forbidden]
# Whitespace is written beside the weight's '='
severity = "warn"
