severity = "info"

[violations.x_content_type_options_invalid]
# X-Content-Type-Options carries a value that is not nosniff
# GRAMMAR obliges the sender, so this defaults to error.
severity = "error"

[violations.x_content_type_options_missing]
# A response does not ask for its content type to be respected
severity = "info"

[violations.x_frame_options_allow_from_obsolete]
# X-Frame-Options carries the retired ALLOW-FROM variant
severity = "error"

[violations.x_frame_options_invalid]
# X-Frame-Options carries neither DENY nor SAMEORIGIN
# GRAMMAR obliges the sender, so this defaults to error.
severity = "error"

[violations.x_xss_protection_invalid]
# X-XSS-Protection asks for neither the filter off nor the page blocked
severity = "info"
