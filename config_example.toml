# Maximum body bytes the proxy will buffer per request or response.
# Over-limit request bodies are rejected with 413; over-limit response bodies
# abort the exchange with 502. The captured transaction is marked with
# request_body_over_limit / response_body_over_limit. Default: 64 MiB.
# max_body_bytes = 67108864
# Maximum body bytes captured into the transaction (for rules) and the captures
# file. Bodies are forwarded in full; only the captured copy is bounded to this
# prefix, after which the body is marked truncated. Default: 1 MiB.
# captures_max_body_bytes = 1048576
# Maximum simultaneous live TCP connections; further connections wait for a
# slot rather than being accepted unboundedly. Default: 1024.
# max_connections = 1024
# On shutdown (Ctrl-C), seconds to wait for in-flight handlers to drain before
# exiting anyway. Default: 30.
# shutdown_timeout_seconds = 30
# Maximum protocol events per connection/session key for protocol-level rules
# (e.g. WebSocket frame sequencing). Larger values let rules detect violations
# across more frames but use more memory. Default: 200.
# max_protocol_event_history = 200
# Optional HTTP/3 (QUIC) listen address. Requires TLS enabled.
# h3_listen = "127.0.0.1:3443"
# Server name (SNI) for the HTTP/3 TLS certificate. Clients must connect
# using this name. Defaults to "localhost" when omitted.
# h3_server_name = "proxy.example.com"
# Forward to origins over HTTP/3 (QUIC) when they are known to speak it. This is
# the outbound (proxy->origin) leg, independent of h3_listen above. Only origins
# whose authority is in h3_upstream_authorities are attempted over H3; all others
# use the H1/H2 client. Default: false.
# h3_upstream_enabled = false
# Origins always tried over H3 (pre-seeds discovery; the first request to an
# origin can't have learned Alt-Svc yet).
# h3_upstream_authorities = ["origin.example.com:443"]
# Origins that must never use H3, even if Alt-Svc advertises it.
# h3_upstream_denylist = ["legacy.example.com:443"]
# Trust an origin's Alt-Svc header to discover an H3 endpoint at runtime. A
# discovered endpoint is still only used once its cert validates for the origin
# authority. Set false to route H3 solely from h3_upstream_authorities. Default: true.
# h3_upstream_trust_alt_svc = true
# UDP bind address for the H3 upstream client. Default: "[::]:0" -- the IPv6
# wildcard, which quinn makes dual-stack (it clears only_v6 and v4-maps an IPv4
# peer), so both families are reachable. Setting this to an IPv4 address makes
# origins that resolve to IPv6 unreachable over H3; they fall back to H1/H2.
# h3_upstream_bind = "[::]:0"
# Extra CA PEM files to trust for origin H3 endpoint certificates (private CAs),
# in addition to the platform trust store.
# h3_upstream_extra_ca_certs = ["/etc/lint-http/origin-ca.pem"]
# Timeout (ms) for the H3 upstream connect/handshake before falling back to
# H1/H2. Default: 5000.
# h3_upstream_connect_timeout_ms = 5000
# Timeout (ms) for the H3 upstream response head (first origin byte) once the
# request is sent. Bounded separately from the connect timeout — this is origin
# think-time, so it is set far more generously to avoid dropping a slow-but-
# healthy origin. An idempotent bodyless request that hits it is retried on
# H1/H2; anything else returns 502. Default: 30000.
# h3_upstream_response_timeout_ms = 30000
# Base backoff (seconds) for the H3 negative cache: after a connect/handshake
# failure an origin is not retried over H3 until this window (doubling per
# consecutive failure) passes. Default: 30.
# h3_upstream_negative_ttl_seconds = 30
# Idle time (ms) after which a pooled H3 connection is evicted; kept under the
# QUIC idle timeout so only live connections are reused. Default: 25000.
# h3_upstream_pool_idle_ms = 25000
# Maximum pooled H3 connections (one per origin); LRU-evicted past this.
# Default: 256.
# h3_upstream_pool_max = 256
# Serve the live capture stream at GET /_lint_http/stream (Server-Sent Events,
# one event per transaction as it commits). Exposes all proxied traffic to
# anyone who can reach the proxy port, so it is opt-in. Default: false.
# live_stream_enabled = false

[tls]
enabled = true
ca_cert_path = "ca.crt"
ca_key_path = "ca.key"
# Domains tunnelled without interception: no certificate is forged for them and
# nothing about them is linted. Commented out because this file is also the
# configuration the binary runs with when none is given, and a default that
# quietly excluded a domain would report a clean nothing for it.
# passthrough_domains = ["example.com"]
# Request headers removed before forwarding upstream. Commented out for a
# different reason than the line above: the rules still see these — the linted
# transaction is built from the headers the *client* sent, and suppression
