[workspace]
resolver = "2"
members = ["lint-http-core", "lint-http-rules", "lint-http-proxy", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The oldest Rust this supports, and a decision rather than an artifact: it is
# roughly current stable minus three releases, which is a support window, not
# the accidental floor a bisect would have found. `cargo` refuses to build on
# anything older, and the `msrv` CI job builds on exactly this to keep the
# number honest — a claim no one compiles is a claim that drifts.
rust-version = "1.94"
authors = ["Alexandre Gomes Gaigalas <alganet@gmail.com>"]
license = "ISC"
repository = "https://github.com/alganet/lint-http"

# Clippy lints enforced across every workspace crate. cognitive_complexity is a
# nursery (allow-by-default) lint; enabling it here makes the threshold in
# clippy.toml actually bite, so function complexity can't silently grow.
[workspace.lints.clippy]
cognitive_complexity = "warn"

# Also nursery, also enabled here for the same reason: a clone nothing reads is
# invisible in review and costs a deep copy at runtime. The two production sites
# it found were a `Vec<Violation>` copied on every transaction the proxy handled
# and two `Arc`s on the CONNECT path; the other 69 were in test modules, which
# is exactly where an unread clone survives longest because nothing is watching.
#
# Its sibling `significant_drop_tightening` was assessed and **deliberately not
# enabled**. Its 25 findings are all requests to shorten a lock scope, and the
# scopes it objects to are long on purpose — `StateStore::record_transaction`
# holds one lock across every index update precisely so they cannot be seen
# apart, which the `Inner` doc comment states. Enabling it would buy nothing and
# cost either `#[allow]`s or a worse design.
redundant_clone = "warn"

# No hand-written `unsafe` anywhere, enforced rather than merely true. A linter
# is a poor place to reach for it: every byte here arrives from a socket and is
# parsed against a grammar, which is exactly where a manual bounds argument is
# worth least and costs most. Nothing has needed it, including the hand-rolled
# WebSocket frame scanner — the closest this tree comes to a case for one.
#
# `deny` and not `forbid`, which was the first spelling and does not compile.
# `linkme`'s `distributed_slice` — the mechanism the whole rule catalogue
# self-registers through — expands to a `#[link_section]` static, which this
# lint counts; under `forbid`, which also refuses the `#[allow]` that would
# lift it, all 193 rules stop building.
#
# The one exemption is written on `pub mod rules;` in `lint-http-rules/src/lib.rs`
# and is scoped to that subtree, because the lint fires once per registration
# inside each `src/rules/*.rs` rather than at the two declarations they expand
# through. `helpers`, `engine`, `queries` and `lint_protocol` stay covered, and
# so does every other crate.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# Internal crates
lint-http-core = { path = "lint-http-core" }
lint-http-rules = { path = "lint-http-rules" }

# Shared third-party dependencies (versions kept in lockstep across crates).
# tokio/hyper carry no features here so each crate adds only what it uses
# (you cannot subtract workspace features via `workspace = true`); the proxy
# opts into `full`, while core/rules stay lean for standalone builds.
tokio = { version = "1.52", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1.10.1", default-features = false }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
httpdate = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "1.1"
bytes = "1"
base64 = "0.23"
sha1 = "0.11"
linkme = "0.3"
parking_lot = "0.12"

# TLS Support
tokio-rustls = "0.26.4"
rustls = "0.23.40"
hyper-rustls = { version = "0.27.9", features = ["http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["server", "tokio", "client-legacy"] }

# HTTP/3 / QUIC
quinn = { version = "0.11.9", default-features = false, features = ["rustls-aws-lc-rs", "runtime-tokio"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

# Certificate generation / misc
rcgen = "0.14"
http-body-util = "0.1"
tokio-tungstenite = "0.30"
futures-util = "0.3"
rustls-native-certs = "0.8"

# Dev
wiremock = "0.6"
rstest = "0.26.1"
http = "1"
