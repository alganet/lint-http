[apycite]
# Only the code. Design notes quote the cite grammar in prose, and the spike's
# prototype carries it in a docstring — apycite is right to refuse to call those
# files clean, so they are simply not in scope. Nothing outside these roots
# enforces a normative sentence.
#
# `xtask/` is the same claim in its stronger form. The documentation generator
# lived under `lint-http-rules/src` and needed an exclude line to say "it
# enforces nothing; it prints" — a claim a reviewer had to re-check on every
# pass. It renders whatever `SpecRef` a rule declares and formats the URL; the
# spec strings in it are test fixtures. Out of scope, that claim is the status
# quo instead of an assertion to maintain.
roots = [
    "lint-http-rules/src",
    "lint-http-core/src",
    "lint-http-proxy/src",
]
output = "specs/specs_generated.yaml"

# Every non-RFC document a cite may name. `RFC 9110` needs no entry: apysource
# ships that pattern, next to the fetcher that has to know the URL anyway — apycite
# has no idea what an RFC is. A family of our own would be a `patterns:` block in
# the sources file below, which is apysource's file and apysource's key. An unknown
# source name is a hard error, never a guess.
sources = "specs/sources.yaml"

# A cite in src/rules/<id>.rs is labelled by the rule id — one rule per file, so
# the label routes a failure straight to the rule. Shared code keeps its path:
# helpers serve many rules, and pretending otherwise would name the wrong one.
[[labels]]
match = "lint-http-rules/src/rules/*.rs"
label = "{stem}"

# A cite in src/violations/<subject>.rs is labelled by the subject, for the same
# routing reason — but this twin also has to exist *before* the first cite moves
# there. Labels group by quoted sentence: without this line, a cite that moves
# off a rule and onto the def it belongs to is absorbed into whichever label
# group already holds that sentence, and the file's own path shows up as the
# label for everything else. Either way the committed specs_generated.yaml
# churns on a rename nobody made.
[[labels]]
match = "lint-http-rules/src/violations/*.rs"
label = "{stem}"

[[labels]]
match = "**/*"
label = "{path}"

# The migration, made monotone. The baseline lists the files in scope that carry
# no cite yet; CI fails if a file *enters* it — a new rule without a citation, or
# a migrated rule that regressed. `--write` may only remove lines, so putting a
# file back takes a human edit that a reviewer sees. The baseline only ever
# shrinks, and shrinking it is the migration. When it is empty, the ratchet *is*
# the permanent rule, with no second mechanism to keep in step.
#
# The scope was `lint-http-rules/src/rules/*.rs` while `helpers/` was migrating.
# It is the whole crate now, and the baseline is *still* empty — which is the only
# reason this widening is allowed to happen. Widening to a non-empty baseline
# would have traded "every file in scope is cited" for "every file in scope is
# cited eventually", and there is no second mechanism to hold the difference.
# 235 files under the scope glob, 13 excluded below, the remaining 222 all
# cited, 0 to migrate. (The previous count subtracted the excludes twice: the
# number `apycite ratchet` prints is already net of them.)
#
# `lint-http-core` and `lint-http-proxy` are deliberately still out of scope, and
# not because their cites do not work — they do, and both crates carry some. It is
# that 9 of 12 core files and 18 of 23 proxy files are uncited, and excluding
# them would mean making 27 claims of "no normative content" about files nobody
# has read for one. Two of those claims would already be false: `protocol_event.rs`
# holds the WebSocket opcode table as prose and is citable the day it becomes an
# enum. An exclude list is a set of assertions, so it may only ever contain
# assertions someone checked.
[ratchet]
scope = "lint-http-rules/src/*.rs"
baseline = "specs/ratchet.txt"

# Every entry here is a claim that a file enforces no sentence of any
# specification, and this is where a reviewer sees the claim. `*` crosses `/`, so
# the scope above catches the whole crate and each of these has to earn its line.
#
# The three `mod.rs` files hold traits, registries and re-exports. `rules/mod.rs`
# also holds `SpecRef` itself. None can ever earn a citation, and without these
# they would sit in the baseline forever — so the baseline could never empty,
# which is the one thing the ratchet is counting down to.
#
# `violations/mod.rs` is the one to re-check as this campaign proceeds, because
# it is the only exclude whose sibling files are *required* to be cited: every
# `violations/<subject>.rs` carries the quotes its defs enforce, and the ratchet
# holds them there. What is excluded is the registry around them — the
# `ViolationDef` struct, the distributed slice, the sorted view — which states no
# sentence of any specification. The day a normative fact is written into this
# file rather than into a def, the exclude is false and the fact is in the wrong
# place.
#
# `engine.rs` dispatches rules and `lint_protocol.rs` is the protocol-event
# entry point: both decide *which* rule runs, never what any rule means.
# `test_helpers.rs` builds fixtures. `lib.rs` is declarations.
#
# `queries/` groups stored transactions — by connection, origin, resource. The
# one to look at twice is `by_origin.rs`, whose doc comment names RFC 6454. It
# does not implement it: the origin arrives as a caller-supplied string and the
# query is a URI prefix filter, so no part of `scheme + host + port` is ever
# parsed or compared. Real origin matching lives in
# `rules/origin_matching_for_cors.rs`, and is cited there.
#
# `helpers/rule_config.rs` parses the shared `allowed`/`headers` array shape out
# of TOML — configuration plumbing, enforcing no sentence of any specification.
# The one normative fact near it, that each rule's entries are matched
# case-insensitively, is a per-registry claim and is cited in each rule's
# `prepare` beside the call, which is exactly why the fold's justification did
# not move here with the parser.
exclude = [
    "lint-http-rules/src/rules/mod.rs",
    "lint-http-rules/src/violations/mod.rs",
    "lint-http-rules/src/helpers/mod.rs",
    "lint-http-rules/src/helpers/rule_config.rs",
    "lint-http-rules/src/queries/*.rs",
    "lint-http-rules/src/engine.rs",
    "lint-http-rules/src/lib.rs",
    "lint-http-rules/src/lint_protocol.rs",
    "lint-http-rules/src/test_helpers.rs",
]
